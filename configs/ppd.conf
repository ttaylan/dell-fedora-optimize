[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=false

[profiles]
# Map GNOME 'balanced' to TuneD 'powersave' so CPU stays in 12W silent mode without GNOME's leaf icon or fast screen dimming
power-saver=powersave
balanced=powersave
performance=throughput-performance

[battery]
balanced=powersave
